name: Owner-authorized GitHub release

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Only after separate owner approval: enter publish-github-release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/heads/release/') && inputs.authorization == 'publish-github-release'
    permissions:
      contents: write
    uses: sort-dev/intellij-sql-plugin-gradle-conventions/.github/workflows/release-plugin-zip.yml@387c9f39bf66142cf9f07074bc340f44ae1d3801
    with:
      plugin-id: dev.sort.datafusion-spice-intellij-plugin
      title: SQL Dialects for DataFusion & Spice
      java-version: "25"
